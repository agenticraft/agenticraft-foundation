repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-spdx-headers
        name: SPDX license headers
        entry: python3 scripts/check_spdx_headers.py
        language: system
        # The gate judges .py files and refuses a run it was handed none of,
        # so the hook selects on that suffix. The `python` tag alone is wider
        # than the gate: pre-commit reads it from the file, and an
        # extensionless script with a python shebang carries it.
        types: [python]
        files: '\.py$'
